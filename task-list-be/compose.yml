name: task-list

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: task_list
      POSTGRES_PASSWORD: password
      POSTGRES_DB: task_list_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_list -d task_list_development"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
    command: bash -lc "rm -f tmp/pids/server.pid && ./bin/rails db:prepare && ./bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      RAILS_ENV: development
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: task_list
      POSTGRES_PASSWORD: password
      POSTGRES_DB: task_list_development
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - bundle:/bundle
    depends_on:
      db:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  bundle:
  postgres_data:
