openapi: 3.0.3
info:
  title: Task List API
  version: v1
servers:
  - url: http://localhost:3000
paths:
  /api/v1/health:
    get:
      summary: Health check
      operationId: getApiV1Health
      tags:
        - Health
      responses:
        "200":
          description: API is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - service
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: task-list-api
              examples:
                healthy:
                  value:
                    status: ok
                    service: task-list-api
